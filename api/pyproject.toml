[project]
name = "bigfoot-api"
version = "0.1.0"
description = "Bigfoot data API: Applications in Supabase Postgres"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pyjwt>=2.9",
  "python-dotenv>=1.0",
  "sentry-sdk[fastapi]>=2.75.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.17.5",
  "pytest-cov>=6",
]

[tool.uv]
package = false

# The `bigfoot-api` Vercel project's build step (BIG-71): applies merged migrations to prod before
# this deployment goes live, and fails the build when it can't. See docs/runbooks/database.md.
[tool.vercel.scripts]
build = "python ../scripts/db-status.py --deploy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-branch --cov-report=term"
markers = ["rebuilds_schema: drops and rebuilds the test schema itself, so conftest restores it afterwards"]

[tool.ruff]
line-length = 120
extend-include = ["../scripts/*.py"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, mccabe (cyclomatic complexity)
select = ["F", "E", "W", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.report]
# Current branch coverage minus 2 points. Raise this as tests are added; never lower it.
fail_under = 97
