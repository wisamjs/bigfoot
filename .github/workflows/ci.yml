name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Throwaway secret: only signs the smoke test's fake session.
      AUTH_SECRET: ci-smoke-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Smoke runs before build: dev and build share .next/.
      - run: npm run smoke
      - run: npm run build
