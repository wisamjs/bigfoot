name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ESLint on its own, so a lint failure shows as its own check on the PR, within a minute and
  # without the database. `check` runs it again inside `npm run check`, as pre-commit does.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-checked rules see the route types next typegen writes, as in `npm run check`.
      - run: npx next typegen
      - run: npm run lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres 17, the major version Supabase runs, on the runner itself: no network distance
    # (the same tests took 33s next to Supabase and 447s from a far region) and no secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway secrets: only sign the smoke test's fake session and its API tokens.
      AUTH_SECRET: ci-smoke-secret-not-used-in-production
      API_SECRET: ci-api-secret-not-used-in-production
      # The service container above. The migrations are plain SQL, so no Supabase bootstrap is needed.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_SCHEMA: bigfoot_test_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: npm ci
      - run: npm run check
      # On this run's TEST_SCHEMA, which smoke and a11y rebuild again for the API they start.
      - run: npm run test:api
      # Smoke runs before build: dev and build share .next/.
      - run: npm run smoke
        timeout-minutes: 2
      # axe-core in the runner's preinstalled Chrome, light and dark.
      - run: npm run a11y
        timeout-minutes: 3
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run build

  # Decides whether the PR needs the owner's manual approval: every PR except one that changes
  # only .md files (scripts/review-needed.mjs is the one definition). Read-only token, and the
  # PR's own code is never run: only its list of file names is read.
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.classify.outputs.review }}
    steps:
      # The base branch, so the classifier is main's, not the PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # `--name-only` lists a renamed file by its new path only, so the old paths are added from
        # the diff's `rename from` lines: moving code to a .md name must still need review.
        # If the base has no classifier yet (the PR that adds it), the PR needs review.
        run: |
          if [ ! -f scripts/review-needed.mjs ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            {
              gh pr diff "$PR" --name-only
              gh pr diff "$PR" | sed -n 's/^rename from //p'
            } | node scripts/review-needed.mjs >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Holds every PR that needs review until the owner clicks "Review deployments" (the
  # `manual-review` environment has a required reviewer). When `classify` says no, this job is
  # skipped, and a skipped job counts as passing for the required check. Waits for `check`, so
  # a red PR never asks for approval. It is skipped on push to main, so merges are never held.
  review-gate:
    needs: [classify, check]
    if: needs.classify.outputs.review == 'true'
    runs-on: ubuntu-latest
    environment: manual-review
    steps:
      - run: echo "Approved in the manual-review environment"

  # Applies merged migrations to the dev database (applying before merge would break main),
  # then fails if any is still missing. One at a time, so two quick merges never race.
  migrations-applied:
    if: github.event_name == 'push'
    concurrency:
      group: migrations-applied
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: npm run db:status -- --apply
