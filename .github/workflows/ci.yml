name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ESLint on its own, so a lint failure shows as its own check on the PR, within a minute and
  # without the database. `check` runs it again inside `npm run check`, as pre-commit does.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-checked rules see the route types next typegen writes, as in `npm run check`.
      - run: npx next typegen
      - run: npm run lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Throwaway secrets: only sign the smoke test's fake session and its API tokens.
      AUTH_SECRET: ci-smoke-secret-not-used-in-production
      API_SECRET: ci-api-secret-not-used-in-production
      # Supabase session-pooler URL. Tests, smoke and a11y only touch this run's own schema.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_SCHEMA: bigfoot_test_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: npm ci
      - run: npm run check
      # GitHub gives Dependabot's runs no Actions secrets, so its PRs skip every step that needs
      # DATABASE_URL: test:api, smoke, a11y and dropping the schema. They still run check and build.
      # Builds this run's test schema, which smoke and a11y then read.
      - run: npm run test:api
        if: github.event.pull_request.user.login != 'dependabot[bot]'
      # Smoke runs before build: dev and build share .next/.
      - run: npm run smoke
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        timeout-minutes: 2
      # axe-core in the runner's preinstalled Chrome, light and dark.
      - run: npm run a11y
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        timeout-minutes: 3
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run build
      - name: Drop this run's test schema
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: api
        run: uv run python ../scripts/drop-test-schema.py

  # Applies merged migrations to the dev database (applying before merge would break main),
  # then fails if any is still missing. One at a time, so two quick merges never race.
  migrations-applied:
    if: github.event_name == 'push'
    concurrency:
      group: migrations-applied
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: npm run db:status -- --apply
