name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Throwaway secrets: only sign the smoke test's fake session and its API tokens.
      AUTH_SECRET: ci-smoke-secret-not-used-in-production
      API_SECRET: ci-api-secret-not-used-in-production
      # Supabase session-pooler URL. Tests, smoke and a11y only touch this run's own schema.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_SCHEMA: bigfoot_test_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: npm ci
      - run: npm run check
      # Builds this run's test schema, which smoke and a11y then read.
      - run: npm run test:api
      # Smoke runs before build: dev and build share .next/.
      - run: npm run smoke
        timeout-minutes: 2
      # axe-core in the runner's preinstalled Chrome, light and dark.
      - run: npm run a11y
        timeout-minutes: 3
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run build
      - name: Drop this run's test schema
        if: always()
        working-directory: api
        run: uv run python ../scripts/drop-test-schema.py

  # Migrations are applied to the dev database by hand after their PR merges (applying
  # earlier breaks main). Goes red on main until every merged migration is applied.
  migrations-applied:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: npm run db:status
